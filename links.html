<style>
* { box-sizing: border-box; }
body {
  min-height: 100vh;
  margin: 0;

  overflow-x: hidden;

}
body::before {
  content: "";

  inset: 0;
  background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.5) 50%, transparent 60%);
  background-size: 250% 250%;
  animation: sheen 8s linear infinite;
  pointer-events: none;
}
@keyframes sheen {
  0% { background-position: 0% 0%; }
  100% { background-position: 100% 100%; }
}
.hub-header {
  max-width: 960px;
  margin: 0 auto 36px;
  position: relative;
  text-align: center;
}
.lang-toggle {
  position: absolute;
  top: 0;
  right: 0;
  background: rgba(255,255,255,0.6);
  border: 1px solid #7dd3fc;
  border-radius: 999px;
  color: #0369a1;
  padding: 8px 16px;
  font-family: "IBM Plex Mono", monospace;
  font-size: 0.85rem;
  cursor: pointer;
}
.hub-title-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 0 0 8px;
}
.hub-title {
  font-family: "IBM Plex Mono", monospace;
  font-weight: 700;
  font-size: clamp(1.4rem, 4vw, 2.2rem);
  margin: 0;
  text-shadow: none;
}
.hub-credit {
  margin: 0;
  font-size: 0.95rem;
  opacity: 0.9;
}
.hub-credit a {
  color: #0369a1;
  font-weight: 600;
}
.card-grid {
  max-width: 960px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 24px;
}
.glass-card {
  background: rgba(255, 255, 255, 0.55);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid #7dd3fc;
  border-radius: 14px;
  box-shadow: 0 4px 20px rgba(14, 116, 190, 0.15);
  padding: 24px 20px;
  color: #0f172a;
  text-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.card-title {
  font-family: "IBM Plex Mono", monospace;
  font-weight: 700;
  font-size: 1.4rem;
  margin: 0;
}
.card-title .fs-prefix { color: #0f172a; }
.card-desc {
  margin: 0;
  flex-grow: 1;
  font-size: 0.95rem;
  line-height: 1.5;
}
.card-btn {
  display: inline-block;
  text-align: center;
  border-radius: 999px;
  padding: 10px 18px;
  text-decoration: none;

.card-fssc .card-title .accent { color: #f97316; }
.card-fssc .card-btn { background: rgba(249, 115, 22, 0.12); border: 1.5px solid #f97316; color: #f97316; }
.card-fssp .card-title .accent { color: #22c55e; }
.card-fssp .card-btn { background: rgba(34, 197, 94, 0.12); border: 1.5px solid #22c55e; color: #22c55e; }
.card-fsst .card-title .accent { color: #eab308; }
.card-fsst .card-btn { background: rgba(234, 179, 8, 0.12); border: 1.5px solid #eab308; color: #eab308; }
footer {

  margin: 40px auto 0;
  text-align: center;
}
.fnote {
  margin: 4px 0;
  font-size: 0.8rem;
  opacity: 0.9;
}
.fnote a { color: #0369a1; }
.horse-icon {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
}
</style>

      <path d="M40 12c2-2 5-3 7-2" />

<script>
(function() {
  var dict = {
    ja: {
      title: "FULL STRIDE 非公式ツール集",
      credit_suffix: " 謹製",
      desc_fssc: "馬情報検索ツール",
      desc_fssp: "馬データ改変ツール",
      desc_fsst: "プロフィールカードジェネレーター",
      btn_open: "開く",
      footer_unofficial: "本ページはファンによる非公式リンク集です。",
      footer_trademark_pre: "『FULL STRIDE』の名称は、",
      footer_trademark_post: "の商標または登録商標です。"
    },
    en: {
      title: "Unofficial FULL STRIDE Tools",
      credit_suffix: "",
      desc_fssc: "Horse search tool",
      desc_fssp: "Horse data editor",
      desc_fsst: "Profile card generator",
      btn_open: "Open",
      footer_unofficial: "This page is an unofficial fan-made link collection.",
      footer_trademark_pre: "\"FULL STRIDE\" is a trademark or registered trademark of ",
      footer_trademark_post: "."
    }
  };
  var lang = "ja";
  var toggle = document.getElementById("lang-toggle");
  function apply() {
    var d = dict[lang];
    document.querySelectorAll("[data-i18n]").forEach(function(el) {
      var key = el.getAttribute("data-i18n");
      if (d[key] !== undefined) el.textContent = d[key];
    });
    document.documentElement.lang = lang;
    toggle.textContent = lang === "ja" ? "ENG" : "JP";
  }
  toggle.addEventListener("click", function() {
    lang = lang === "ja" ? "en" : "ja";
    apply();
  });
  apply();
})();
</script>
